; ---- Key map (0.4.1): everything is on the numpad. NumLock must be ON (with it off, the numpad sends other keys).
;   Numpad 0  reflections: off / RT / debug views, Ctrl = DLSS RR on/off    Numpad .  probe (logs what is under the crosshair), Ctrl = baseline: everything off
;   Numpad 1  GI: on/debug/off, Ctrl = RR raw           Numpad 2  lamps: RT / game, Ctrl = RR smoke guide
;   Numpad 3  RT sun shadows on / off                   Numpad 4  thin-glass reflections: on / debug / off, Ctrl = untagged-window search
;   Numpad 5  game lamps in refl. + GI (Ctrl = off-screen probe floor) Numpad 6  thick-glass extra layer
;   Numpad 7  see-through surfaces in reflections       Numpad 8  game cubemap reflections on glass
;   Numpad 9  view through glass sharp / blurred        Numpad /  soft shadows (Ctrl = reflections weaker)   Numpad *  leaf cutouts (Ctrl = reflections stronger)
;   Numpad +  reflections brighter (Ctrl = glossier)     Numpad -  reflections darker (Ctrl = softer)
; Each key shows what it switched as a top-left message (bOnScreenMessages).

; Starfield RT settings. Lives next to StarfieldRT.dll in SFSE\Plugins.

[RT]
; ---- Baseline (0.5.28) ----
; 1 = start with every effect off and the game's own look: the game's reflections, GI, lamps and sun shadows, no thin-glass
; pass, no glass tweaks (Numpad 8 / 9 / 6), Ray Reconstruction paused (plain DLSS). Turn effects
; back on one at a time with their keys (Numpad 3 sun shadows, Numpad 0 reflections, Numpad 2 lamps, Numpad 1 GI, Numpad 4
; thin glass, Ctrl+Numpad 0 Ray Reconstruction). Changing Gameplay Options re-applies the baseline. Ctrl+Numpad . applies it
; live. 0 = start with the effects on as configured below.
bStartAllOff=1

; ---- Quality levels (0.2.34) ----
; 0 = off, 1 = low, 2 = medium, 3 = high, 4 = ultra, -1 = custom (use the individual settings further down).
; 0.2.36: with StarfieldRT.esm active, Settings > Gameplay Options > Starfield RT changes these in-game and wins over
;   the values here (the choice is saved with your game). -1 here (custom) ignores the menu for that effect.
; Reflections: low/medium trace one ray per 2x2 pixels (about 4x cheaper) and upsample; high/ultra one per pixel.
;   low also skips sun shadows inside reflections. Ray length 1000 / 2000 / 3000 / 6000. Characters in the RT scene:
;   16 within 10 / 32 within 20 / 64 within 40 / 128 within 60 units (they also cast RT shadows; 0.5.11 raised high/ultra).
; Shadows: 1 / 2 / 4 / 8 rays per pixel (soft penumbra quality), ray length 1000 / 1500 / 2000 / 3000; ultra traces
;   at full resolution. High is the setting used through 0.2.33.
; 0.4.8: the reflection level also sets GI and RT lamps: up to High, GI traces one ray per 2x2 pixels and lamps
;   shadow-test their strongest 4 per pixel; Ultra traces GI at every pixel with 2 rays and shadow-tests 8 lamps.
;   Ultra (4) is the default since 0.4.8. The in-game Gameplay Options menu overrides these two lines.
iReflectionQuality=4
iShadowQuality=4
; 0.2.39 (glass, step G2): 1 = hide the game's own probe reflection on glass (it showed on top of the RT reflection).
; Thin glass has no RT reflection yet (step G3), so it shows no reflection at all while this is on.
; The key toggles it live (default 104 = Numpad 8, with Num Lock on).
bHideGameGlassReflections=1
iGlassReflectionKey=104
; 0.2.42: 1 = sharp view through glass. The game blurs what is behind glass (more on rough or frosted glass);
; this makes all glass see the sharp image, frosted glass included. The key toggles it live (105 = Numpad 9).
bSharpGlass=1
iSharpGlassKey=105
; 0.2.50: 1 = reflection rays pass through see-through materials (glass, light-effect panels and similar, found by
; their material flags). Without it they were reflected as big solid blobs. Sun shadows are not affected.
; The key toggles it live (103 = Numpad 7).
bGlassSeparate=1
iGlassSeparateKey=103
; 0.2.51: RT reflections on thin glass (windows, panes): found per pixel where the game blends a see-through surface in
; front of the solid scene, then mirror-traced with the Fresnel of real glass. Strength scales them (1 = physical).
; The key cycles them live (100 = Numpad 4): on -> stage debug view -> off -> on. In the debug view: blue = no glass
; there, magenta = the game draws glass there but our ray found nothing, red = no room before the solid surface,
; yellow = reflected (glass-tagged object), white = reflected (object not tagged as glass).
bThinGlassReflections=1
fThinGlassStrength=3.0
; Only reflect where the game's transparency coverage (OIT optical depth) exceeds this. -1 = no gate.
fThinGlassMinCoverage=0.001
; 0.4.10: 1 = also reflect on windows whose material isn't tagged as see-through, found as "any object in front of the
; surface behind" (some Neon shop windows). 0 = only tagged glass. 0.5.13: default 0 (the search ran wherever smoke
; drifted, which flickered). Ctrl+Numpad 4 toggles it in game.
bThinGlassUntaggedFallback=0
iThinGlassKey=100
; 0.3.0: RT diffuse GI. Replaces the game's indirect (bounce) light with ray-traced light: one ray per 2x2 pixels,
; lit by the sun (with shadow) and the game's own lamps, smoothed over time and space. Rays that reach the sky see the
; game's own ambient. iGI: 1 on, 2 debug (GI light alone on grey surfaces), 0 off; the key cycles them (97 = Numpad 1).
; fGIStrength scales it (1 = physically based; 0.5.46: default 1, was 2, which made light surfaces glow white). fGIBounce = how much of the game's own ambient
; lights the surfaces the rays hit (a cheap second bounce). iGIHistoryFrames = frames blended (more = smoother, slower
; to react to moving lights). fGIFilterRadius = blur radius in ray cells. iGITraceScale 1 = a ray per pixel (slower).
; 0.4.0: the game's lamps (point, spot and area lights) are drawn by the plugin with ray-traced shadows, and the game's
; own lamp lighting is switched off. The sun is not affected. fRTLampScale = their brightness (1 = the game's). The
; strongest 4 lamps per pixel get a shadow ray ([RT] iReflectionLocalShadowRays). Numpad 2 (98) switches back to the
; game's lamps for comparison.
bRTLamps=1
; 0.5.0: DLSS Ray Reconstruction (NVIDIA's AI denoiser from Cyberpunk's path tracing) in place of DLSS Super Resolution.
; Needs sl.dlss_d.dll (Streamline 2.14.16, production) and nvngx_dlssd.dll next to Starfield.exe and DLSS turned on in
; the game. Falls back to normal DLSS by itself if anything is missing. Read at game start.
bDLSSRayReconstruction=1
; 0.5.7: RR raw mode. While Ray Reconstruction runs, reflections and GI skip our own temporal and spatial filters and
; trace one sample per pixel, so RR gets the raw noise it is trained on. 0 = keep our filters (default since 0.5.10:
; raw flickers in game, our filters + RR are much more stable). Ctrl+Numpad 1 toggles it in game.
bRRRawMode=0
; 0.5.23: give Ray Reconstruction the game's image from just before smoke, glass and particles are drawn
; (kBufferTypeColorBeforeTransparency), so it stops treating smoke as part of the reflections behind it.
; Ctrl+Numpad 2 toggles it in game. 0.5.26: off by default: the game alternates between several copies of this image, so RR
; often got the wrong frame's copy and darkened large areas.
bRRColorBeforeTransparency=0
; 0.4.5: shadow rays toward lamps at points seen in reflections and by GI rays (0-15). 0 = those points are lit by the
; lamps without a shadow test: far less noise in reflections, at the cost of lamps shining through walls in reflections.
; (The RT lamp pass on screen always shadows its strongest 4 lamps: iReflectionLocalShadowRays.)
iHitLampShadowRays=0
fRTLampScale=1.0
iRTLampKey=98
iGI=1
; 0.3.1: 1 = every hotkey shows what it switched (top-left HUD message), 0 = only the log.
bOnScreenMessages=1
fGIStrength=1.0
fGIBounce=0.5
iGIRayLength=100
iGIHistoryFrames=48
fGIFilterRadius=6.0
iGITraceScale=2
; 0.4.8: GI rays per cell (custom quality only; Ultra uses 2).
iGIRays=1
; 0.3.3: GI rays that hit something that was on screen last frame take its real lit colour from last frame's image, so
; neon signs, screens and lit walls light their surroundings (and you get extra bounces for free). 1 = physically based,
; 0 = off. Above 1 the light can feed on itself and run away. Off-screen hits are shaded as before.
fGIScreenLight=1.0
; 0.3.6: glowing materials (neon signs, light strips) give off light at ray hits, so they light GI and show in
; reflections even when they are off screen. fEmissiveScale = their brightness (0 = off). iEmissiveModel: 0 = adaptive
; (the game keeps their on-screen brightness constant: 2^exposure offset), 1 = absolute (luminous emittance).
; Glowing screens and panels (material family 7) are not covered yet: they light things only while on screen.
fEmissiveScale=1.0
iEmissiveModel=0
iGIKey=97
; 0.2.58: light reflected objects with the game's own lamps (point, spot and area lights), not just sun and ambient.
; Scale = their brightness; shadow rays = how many of the lights reaching a reflected point get a shadow test (more =
; fewer lights leaking through walls, slower). The key toggles them live (101 = Numpad 5).
bReflectionLocalLights=1
fReflectionLocalLightScale=1.0
iReflectionLocalShadowRays=4
iLocalLightKey=101
; 0.2.46: thick glass (the doors) is in the G-buffer with some roughness, so its RT reflection came out blurry, like a
; smudged mirror. iSmoothGlassTypes is a bitmask of G-buffer material types to treat as glass (type n = 2^n; find the type
; with the Numpad 0 "material type" view). Their roughness is multiplied by fGlassRoughnessScale (0 = mirror sharp). 0 = off.
; 0.2.47: glass is type 2 (green in the view), so the default is 4 (= 2^2).
iSmoothGlassTypes=4
fGlassRoughnessScale=0.0
; 0.2.48: thick glass (doors) is drawn twice; its see-through layer refracts a copy of the scene that already shows the
; door's reflection, adding a warped second reflection. 1 = hide that layer (the solid layer keeps the RT reflection).
; The key toggles it live (102 = Numpad 6).
bHideThickGlassLayer=1
iThickGlassLayerKey=102
; 1 = build ray tracing acceleration structures (BLASes) from Starfield's meshes. 0 = off.
bEnableBLAS=1

; Most BLAS builds recorded per frame. Higher fills the scene faster but costs more GPU time per frame.
iBlasBuildsPerFrame=128

; 0.5.11: frames between scans for meshes that changed (the game swapping in a closer level of detail). Lower = objects
; rejoin RT shadows and reflections sooner as you approach (less pop-in), at a little CPU time. Was 60.
iBlasScanInterval=10

; Video memory cap for all BLASes, in MB.
iBlasBudgetMB=2048

; 0 = build every rigid mesh, including those whose positions live in separately streamed buffers
;     (many trees and props; each build re-checks the live mesh record and the buffer bounds first).
; 1 = only meshes in Starfield's persistent 4 GB geometry pool (the cautious 0.1.12-0.1.26 default,
;     which left many trees out of the ray-traced scene).
bBlasPoolOnly=0

; 1 = build the scene's top-level acceleration structure (TLAS) every frame from Starfield's instances.
bEnableTLAS=1

; Instance slots in the TLAS. Starfield's instance records past this index are ignored.
iTlasMaxInstances=524288

; Ray-traced sun shadows, written into the shadow mask the game's lighting reads.
; 0 = off
; 1 = on (combined with the game's contact shadows)
; 2 = debug: ray-traced result replaces the contact shadows on the whole screen
; 3 = debug A/B: left half of the screen ray-traced, right half vanilla
; 4 = debug: shadow-ray hit distance (black = hit right at the surface, grey = hit far away, normal = no hit)
; 5 = debug: alignment test. Rays from the camera must hit our scene where the game's depth says.
;     Sunlit surfaces stay normal where they match and go dark where they don't.
iSunShadows=2

; In-game key that switches the RT sun shadows off and back on (to the mode above), for comparisons.
; Windows virtual-key code: 99 = Numpad 3 (default since 0.4.1; was 122 = F11), 0 = no key.
iSunToggleKey=99

; How far shadow rays travel toward the sun, in game units.
iSunRayLength=2000

; Ray start offset from the surface: base in centimetres, plus an extra amount per kilometre of view distance.
iSunBiasCm=10
iSunBiasPerKm=2

; Leave instances larger than this (half-size, game units) out of the TLAS, e.g. sky or planet shells.
iTlasMaxInstanceSize=1000

; Leave instances farther than this (game units, about metres) from the camera out of the TLAS. Sun shadow rays
; start at visible surfaces, so very distant objects rarely matter and only cost build time. 0 = keep everything.
iTlasCullDistance=1500

; Alpha-tested shadows: leaves, grass, fences and other cutout materials only block sunlight where their
; opacity texture is solid. 0 = treat them as solid sheets (faster).
bAlphaTest=1

; Soft shadows: several rays per pixel toward random points on the sun's disc, then a penumbra-aware filter,
; so shadows are sharp where objects touch the ground and soften with distance. 0 = one hard ray per pixel.
bSoftShadows=1
; Rays per pixel (1-16). More = smoother penumbras, more GPU time.
iSunShadowRays=4
; Apparent angular radius of the sun in degrees (the real sun is about 0.27; 0.15 keeps shadows crisp). Bigger = softer shadows.
fSunAngularRadiusDeg=0.15
; Largest blur radius in pixels for the penumbra filter (1-32).
iSoftShadowMaxBlur=4
; Soft shadow trace resolution: 2 = one ray sample per 2x2 pixels, upsampled with depth weights (about 4x
; cheaper); 1 = every pixel (sharpest, slowest).
iSoftShadowScale=2
; Live on/off key for soft shadows (111 = Numpad /, 0 = no key).
iSoftToggleKey=111

; Live on/off key for the alpha test (106 = Numpad *, 0 = no key), to compare leaf shadows.
iAlphaToggleKey=106

; While RT sun shadows are on, switch off the game's own sun shadow cascades so the RT shadow alone decides what
; is in sunlight. 0 = keep the game's shadows underneath; 2 = drop the cascade pass's draw calls (default; no
; flicker, tested in 0.2.20); 3 = clear the cascade maps after their pass. 1 (0.2.11-0.2.20) now acts as 2.
bReplaceGameSunShadows=2

; ---- Skinned characters (0.2.32) ----
; NPCs, creatures and the player are skinned meshes (animated by bones). Those within this many units of the camera
; join the ray-traced scene, so they show up in RT reflections and cast RT sun shadows. 0 = leave them out.
iSkinnedRadius=20
; At most this many skinned instances at once (max 128). A character is several instances (body, head, hair, outfit);
; the nearest win.
iSkinnedMax=32

; ---- RT reflections (0.2.27, step R4) ----
; 1 = RT reflections on at start (replacing the game's cubemap reflections on smooth surfaces), 0 = off.
; Numpad 0 ([Debug] iReflectionDebugKey) cycles: off -> RT reflections -> debug views -> off.
iReflections=1
; 1 = RT reflections replace the game's cubemap reflections everywhere (every roughness; rays that hit nothing
; still see the game's sky/probe colour). 0 = only smooth surfaces get RT, fading to the game's by the range below.
bReplaceGameReflections=1
; (Used when bReplaceGameReflections=0.) Roughness range where RT reflections fade back to the game's own (softer)
; reflection: fully RT below the start,
; fully the game's above the end. Since 0.2.29 RT reflections blur with roughness themselves (glossy rays).
fReflectionFadeStart=0.45
fReflectionFadeEnd=0.7
; Glossy filter radius in pixels for roughness 1 (scaled by the square root of roughness). Larger = smoother but
; blurrier rough reflections; smaller = sharper but grainier.
fReflectionBlurPx=10
; 0.5.24: art controls for RT reflections (with bReplaceGameReflections=1; 0.5.27: non-metal surfaces only, metals keep
; their own look). fReflectionGloss multiplies the surface roughness
; for reflections (1 = the game's materials as they are, lower = sharper and glossier, 0.2..1). fReflectionStrength
; multiplies how strong reflections are (1 = physically based, 0.5..3). Starfield's floors are fairly rough, so with 1 / 1
; their reflections are faint and blurry. Live: Ctrl+Numpad + / - (gloss), Ctrl+Numpad * / / (strength).
fReflectionGloss=0.65
fReflectionStrength=0.5
; Brightness of reflected objects: the game's probe light in that direction, times this, plus the sun (with shadow).
; The sun's strength is [Debug] fReflectionSunIntensity (scaled by the game's exposure). Numpad + / Numpad - change both
; live (x1.25 per press, logged); put the logged value here to keep it.
fReflectionProbeAmbient=2.5
; (Used when bReplaceGameReflections=0; with 1 the cut-off is 0.02 and those pixels get no reflection.)
; Reflections fainter than this (the game's reflection weight, 0..1) keep the game's reflection and trace no ray.
; Lower = more surfaces get RT reflections, at more cost.
fReflectionMinWeight=0.045
; Reflection ray length in world units (custom quality only).
iReflectionRayLength=3000
; Custom quality only: 1 = a reflection ray per pixel, 2 = one per 2x2 pixels. And sun shadows inside reflections (1/0).
iReflectionTraceScale=2
bReflectionHitShadows=1
; 0.3.4: blend RT reflections over several frames (lined up with the camera's motion) to remove most of their noise.
; Rough surfaces keep more history than mirror-like ones; 0 = per-frame only (the old, noisier behaviour).
bReflectionTemporal=1

[Debug]
; DRED crash diagnostics: if the GPU device dies, the log records the faulting GPU address, the allocations
; around it (including recently freed ones) and where each command list stopped. Small GPU cost; 0 = off.
bDred=1

; Profiler: logs a PERF line about every 10 s with the frame time and the plugin's GPU time per stage
; (BLAS builds, TLAS build, shadow rays, soft filter) and CPU time. A new line starts whenever the sun, soft-shadow or cutout keys change.
bProfiler=1

; Lit test key (0.4.1: no default key; 115 = F4): RT is forced to "fully lit" while the game's sun shadow maps stay off, so any shadow
; still visible comes from another game system. Press again to go back.
iLitTestKey=0

; Skip test key (0.4.1: no default key; 114 = F3): each press drops the draw calls of the next shadow-map render pass while RT is on
; (ShadowMapInstance, GroupedDynamicShadowMap, ClearShadowMaps, ClearShadowMapGroup, TerrainShadows,
; SetupDynamicShadow, then none). Used to find the pass that draws the game's sun shadow cascades.
iSkipPassKey=0

; Debug probe key: aim the screen centre at something and press it. The log then says what a ray from
; the camera hits there and what blocks the sun at that spot (instance/mesh records). 110 = Numpad . (default since 0.4.1; was F8), 0 = no key.
iProbeKey=110

; RT reflections key (Numpad 0). Each press cycles: off (the game's reflections) -> RT reflections ON -> debug views:
; world normal -> mirror hit (each object a flat colour, darker further away; blue = ray hit nothing) -> roughness
; (white = rough) -> RT reflection colour (texture colour of what each ray hits, sun + flat ambient) -> off.
; 96 = Numpad 0, 0 = no key. fReflectionDebugScale brightens or dims both the debug views and the RT reflections.
; fReflectionAmbient is the debug colour view's flat ambient; fReflectionSunIntensity is the sun on reflected objects.
iReflectionDebugKey=96
; Live reflection brightness keys (0.2.28): 107 = Numpad + (brighter), 109 = Numpad - (darker), 0 = no key.
iReflectionBrighterKey=107
iReflectionDarkerKey=109
fReflectionDebugScale=1.0
fReflectionSunIntensity=1.0
fReflectionAmbient=0.15

; Test pattern written into Starfield's contact shadow mask, which the lighting reads.
; 0 = off, 1 = checker squares forced into shadow, 2 = checker squares forced fully lit.
iMaskTest=0

; Size of the checker squares, in pixels of the internal render resolution.
iMaskTestCell=64

; 1 = load Microsoft PIX's GPU capturer at startup so frames can be captured with PIX.
; Requires PIX to be installed. ReShade-based mods must be disabled while this is on.
bLoadPixGpuCapturer=0

; In-game key that saves a one-frame GPU capture to Documents\StarfieldRT Captures.
; Windows virtual-key code: 0 = no key (default since 0.4.1), 121 = F10.
iPixCaptureKey=0
